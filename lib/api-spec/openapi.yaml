openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Cab Marketplace local development API
servers:
  - url: /api
    description: Local API base path
tags:
  - name: health
  - name: auth
  - name: profiles
  - name: listings
  - name: vehicles
  - name: drivers
  - name: leads
  - name: quotations
  - name: ratings
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a customer or provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Get the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profiles/customer:
    get:
      operationId: getCustomerProfile
      tags: [profiles]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
    put:
      operationId: updateCustomerProfile
      tags: [profiles]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfileInput"
      responses:
        "200":
          description: Updated customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
  /profiles/provider:
    get:
      operationId: getProviderProfile
      tags: [profiles]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
    put:
      operationId: updateProviderProfile
      tags: [profiles]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderProfileInput"
      responses:
        "200":
          description: Updated provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [profiles]
      security: [{ bearerAuth: [] }]
      summary: Get a role-aware dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: Search available cab listings
      parameters:
        - { $ref: "#/components/parameters/Source" }
        - { $ref: "#/components/parameters/Destination" }
        - { $ref: "#/components/parameters/VehicleType" }
        - { $ref: "#/components/parameters/MinSeats" }
        - { $ref: "#/components/parameters/MaxPrice" }
        - { $ref: "#/components/parameters/Sort" }
      responses:
        "200":
          description: Matching listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }
    post:
      operationId: createListing
      tags: [listings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Listing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
    put:
      operationId: updateListing
      tags: [listings]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingUpdate" }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
    delete:
      operationId: deleteListing
      tags: [listings]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Listing deleted }
  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Provider vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
    post:
      operationId: createVehicle
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
  /vehicles/{id}:
    put:
      operationId: updateVehicle
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleUpdate" }
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Vehicle deleted }
  /drivers:
    get:
      operationId: listDrivers
      tags: [drivers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Provider drivers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Driver" }
    post:
      operationId: createDriver
      tags: [drivers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverInput" }
      responses:
        "201":
          description: Created driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
  /drivers/{id}:
    put:
      operationId: updateDriver
      tags: [drivers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverUpdate" }
      responses:
        "200":
          description: Updated driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
    delete:
      operationId: deleteDriver
      tags: [drivers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Driver deleted }
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Role-scoped leads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lead" }
    post:
      operationId: createLead
      tags: [leads]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Lead detail with quotes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
    put:
      operationId: updateLead
      tags: [leads]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadUpdate" }
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Role-scoped quotations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quotation" }
    post:
      operationId: createQuotation
      tags: [quotations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotationInput" }
      responses:
        "201":
          description: Created quotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quotation" }
  /quotations/{id}:
    get:
      operationId: getQuotation
      tags: [quotations]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Quotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quotation" }
    put:
      operationId: updateQuotation
      tags: [quotations]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotationUpdate" }
      responses:
        "200":
          description: Updated quotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quotation" }
  /ratings:
    post:
      operationId: createRating
      tags: [ratings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingInput" }
      responses:
        "201":
          description: Created rating
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rating" }
  /ratings/provider/{providerId}:
    get:
      operationId: listProviderRatings
      tags: [ratings]
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Provider ratings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Rating" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Source:
      name: source
      in: query
      schema: { type: string }
    Destination:
      name: destination
      in: query
      schema: { type: string }
    VehicleType:
      name: vehicleType
      in: query
      schema: { type: string }
    MinSeats:
      name: minSeats
      in: query
      schema: { type: number, minimum: 1 }
    MaxPrice:
      name: maxPrice
      in: query
      schema: { type: number, minimum: 0 }
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [relevance, price_asc, price_desc]
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    User:
      type: object
      required: [id, name, email, phone, role, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [CUSTOMER, PROVIDER, ADMIN]
        createdAt: { type: string }
    RegisterInput:
      type: object
      required: [name, email, phone, password, role]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string }
        phone: { type: string, minLength: 8 }
        password: { type: string, minLength: 6 }
        role:
          type: string
          enum: [CUSTOMER, PROVIDER]
        aadharId:
          type: string
          minLength: 4
          description: Aadhar/KYC ID proof. Required when role is CUSTOMER.
        companyName:
          type: string
          description: Company name for provider.
        companyRegistrationNumber:
          type: string
          description: Unique company registration number.
        gstNumber:
          type: string
          description: 15-character GST identification number.
        companyAddress:
          type: string
          description: Registered company address.
        city:
          type: string
          description: Company city.
        state:
          type: string
          description: Company state.
        pincode:
          type: string
          description: 6-digit postal pincode.
        ownerName:
          type: string
          description: Owner full name.
        ownerEmail:
          type: string
          description: Owner email address.
        ownerPhone:
          type: string
          description: Owner phone number.
        ownerDob:
          type: string
          description: Owner date of birth.
        kycType:
          type: string
          description: KYC ID type (Aadhaar, PAN, Other).
        kycNumber:
          type: string
          description: KYC ID number.
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 1 }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    CustomerProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            preferences: { type: ["string", "null"] }
            city: { type: ["string", "null"] }
            aadharId: { type: ["string", "null"] }
    CustomerProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string, minLength: 8 }
        preferences: { type: string }
        city: { type: string }
        aadharId: { type: string, minLength: 4 }
    ProviderProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            providerId: { type: string }
            companyName: { type: ["string", "null"] }
            companyRegistrationNumber: { type: ["string", "null"] }
            gstNumber: { type: ["string", "null"] }
            description: { type: ["string", "null"] }
            address: { type: ["string", "null"] }
            city: { type: ["string", "null"] }
            state: { type: ["string", "null"] }
            pincode: { type: ["string", "null"] }
            ownerName: { type: ["string", "null"] }
            ownerEmail: { type: ["string", "null"] }
            ownerPhone: { type: ["string", "null"] }
            ownerDob: { type: ["string", "null"] }
            kycType: { type: ["string", "null"] }
            kycNumber: { type: ["string", "null"] }
            rating: { type: number }
    ProviderProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string, minLength: 8 }
        companyName: { type: string }
        description: { type: string }
        address: { type: string }
    DashboardSummary:
      type: object
      required: [role, metrics, recentLeads, recentQuotations]
      properties:
        role: { type: string }
        metrics:
          type: object
          additionalProperties: { type: number }
        recentLeads:
          type: array
          items: { $ref: "#/components/schemas/Lead" }
        recentQuotations:
          type: array
          items: { $ref: "#/components/schemas/Quotation" }
    Vehicle:
      type: object
      required: [id, providerId, vehicleType, model, registrationNumber, seatingCapacity]
      properties:
        id: { type: string }
        providerId: { type: string }
        vehicleType: { type: string }
        model: { type: string }
        registrationNumber: { type: string }
        seatingCapacity: { type: number }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
    VehicleInput:
      type: object
      required: [vehicleType, model, registrationNumber, seatingCapacity]
      properties:
        vehicleType: { type: string }
        model: { type: string }
        registrationNumber: { type: string }
        seatingCapacity: { type: number, minimum: 1 }
        description: { type: string }
        imageUrl: { type: string }
    VehicleUpdate:
      allOf:
        - $ref: "#/components/schemas/VehicleInput"
    Driver:
      type: object
      required: [id, providerId, name, phone, licenseNumber, aadharId]
      properties:
        id: { type: string }
        providerId: { type: string }
        name: { type: string }
        phone: { type: string }
        licenseNumber: { type: string }
        aadharId: { type: string }
    DriverInput:
      type: object
      required: [name, phone, licenseNumber, aadharId]
      properties:
        name: { type: string }
        phone: { type: string }
        licenseNumber: { type: string }
        aadharId: { type: string, minLength: 4 }
    DriverUpdate:
      allOf:
        - $ref: "#/components/schemas/DriverInput"
    Listing:
      type: object
      required: [id, providerId, vehicleId, title, description, vehicleType, source, destination, price, status, seatingCapacity, providerName]
      properties:
        id: { type: string }
        providerId: { type: string }
        vehicleId: { type: string }
        title: { type: string }
        description: { type: string }
        vehicleType: { type: string }
        source: { type: string }
        destination: { type: string }
        price: { type: number }
        status: { type: string, enum: [ACTIVE, PAUSED] }
        seatingCapacity: { type: number }
        providerName: { type: string }
        companyName: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        rating: { type: number }
    ListingInput:
      type: object
      required: [vehicleId, title, description, source, destination, price]
      properties:
        vehicleId: { type: string }
        title: { type: string }
        description: { type: string }
        source: { type: string }
        destination: { type: string }
        price: { type: number, minimum: 0 }
        status: { type: string, enum: [ACTIVE, PAUSED] }
    ListingUpdate:
      allOf:
        - $ref: "#/components/schemas/ListingInput"
    Lead:
      type: object
      required: [id, customerId, source, destination, travelDate, passengers, vehicleType, requirements, status, createdAt, customerName, quotationCount]
      properties:
        id: { type: string }
        customerId: { type: string }
        source: { type: string }
        destination: { type: string }
        travelDate: { type: string }
        passengers: { type: number }
        vehicleType: { type: string }
        requirements: { type: string }
        status: { type: string, enum: [OPEN, QUOTED, ACCEPTED, CLOSED] }
        createdAt: { type: string }
        customerName: { type: string }
        quotationCount: { type: number }
        quotations:
          type: array
          items: { $ref: "#/components/schemas/Quotation" }
    LeadInput:
      type: object
      required: [source, destination, travelDate, passengers, vehicleType, requirements]
      properties:
        source: { type: string }
        destination: { type: string }
        travelDate: { type: string }
        passengers: { type: number, minimum: 1 }
        vehicleType: { type: string }
        requirements: { type: string }
    LeadUpdate:
      type: object
      properties:
        status: { type: string, enum: [OPEN, QUOTED, ACCEPTED, CLOSED] }
    Quotation:
      type: object
      required: [id, leadId, providerId, price, message, status, providerName, companyName, createdAt]
      properties:
        id: { type: string }
        leadId: { type: string }
        providerId: { type: string }
        price: { type: number }
        message: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED] }
        providerName: { type: string }
        companyName: { type: ["string", "null"] }
        createdAt: { type: string }
    QuotationInput:
      type: object
      required: [leadId, price, message]
      properties:
        leadId: { type: string }
        price: { type: number, minimum: 0 }
        message: { type: string }
    QuotationUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED] }
    Rating:
      type: object
      required: [id, customerId, providerId, quotationId, rating, review, createdAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        providerId: { type: string }
        quotationId: { type: string }
        rating: { type: number, minimum: 1, maximum: 5 }
        review: { type: string }
        createdAt: { type: string }
    RatingInput:
      type: object
      required: [quotationId, rating, review]
      properties:
        quotationId: { type: string }
        rating: { type: number, minimum: 1, maximum: 5 }
        review: { type: string }
    AdminOverview:
      type: object
      required: [users, customers, providers, vehicles, listings, leads, quotations]
      properties:
        users: { type: number }
        customers: { type: number }
        providers: { type: number }
        vehicles: { type: number }
        listings: { type: number }
        leads: { type: number }
        quotations: { type: number }